# =============================================================================
# dbt Profiles Configuration for ECS
# =============================================================================
# Profile name must match dbt_project.yml 'profile:' setting
# All values come from ECS task definition environment variables
# =============================================================================

generic_access_staging:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    
    dev:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DBT_DATABASE_DEV') }}"
      schema: "{{ env_var('DBT_SCHEMA_DEV') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      private_key: "{{ env_var('DBT_PRIVATE_KEY') }}"
      threads: 4
      client_session_keep_alive: true
    
    uat:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DBT_DATABASE_DEV') }}"
      schema: "{{ env_var('DBT_SCHEMA_DEV') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      private_key: "{{ env_var('DBT_PRIVATE_KEY') }}"
      threads: 4
      client_session_keep_alive: true
    
    prod:
      type: snowflake
      account: "{{ env_var('DBT_SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_SNOWFLAKE_USER') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('DBT_DATABASE_DEV') }}"
      schema: "{{ env_var('DBT_SCHEMA_DEV') }}"
      warehouse: "{{ env_var('DBT_WAREHOUSE') }}"
      private_key: "{{ env_var('DBT_PRIVATE_KEY') }}"
      threads: 4
      client_session_keep_alive: true

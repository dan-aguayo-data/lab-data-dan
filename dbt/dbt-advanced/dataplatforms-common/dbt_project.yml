      snowflake_warehouse: |
        {%- if  target.name.upper() == "DEV" -%} ETL_CES_DEV
        {%- elif target.name.upper() == "SIT"  -%} ETL_CES_SIT
        {%- elif target.name.upper() == "UAT"  -%} ETL_CES_UAT
        {%- elif target.name.upper() == "PROD"  -%} ETL_CES_SMALL
        {%- endif -%}
      database: |
        {%- if target.name.upper() == "DEV" -%} COMMON_DEV
        {%- elif target.name.upper() == "UAT" -%} COMMON_UAT
        {%- elif target.name.upper() == "PROD" -%} COMMON_PROD
        {%- else -%} COMMON_{{ target.name.upper() }}
        {%- endif -%}
      schema: DWH
      materialized: table
      tags: 
        - DWH
        - AGING
        - UAT
        - PROD
        - DEV
        - FULL_REFRESH

on-run-end:
  - "{{ grant_permission_to_schema(schemas, var('project_role'), var('branch')) }}"
  - "{{ grant_select_to_schema(schemas, var('reporting_role'), var('branch')) }}"
  - "{{ grant_to_external(var('external_databases'), var('external_schemas'), var('external_role'), var('branch')) }}"
  #- "{{share_with_control_table(database_schemas) }}"
  #- "{{ share_with_subsidiaries(var('share_with'),'DWH') }}"

vars:
  branch: ''
  data_stages: [] # schemas to be cloned from prod and cleaned-up on test
  src_clone_db: ''
  external_schemas: ['DWH', 'DWH_BRAZE']
  external_databases: ['EXT_PROD']
  external_role: ['EXTERNAL']
  project_role: ['SF_DEV_CES']
  reporting_role: ['REPORTING_CES']
  no_schema_update_branches: ['master','main']
  #share_with: ['COEX','WARRRL']
  share_dbt_project_name: 'COMMON'
  erp_delta_load_days: -1
  general_delta_load_hours: -4
  general_delta_load_minutes: -30
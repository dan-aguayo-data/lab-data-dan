on-run-end:
  - "{{ grant_permission_to_db_schema(database_schemas, var('grant_permission_roles'), var('branch'), var('schema_exclusions'),var('db_exclusions')) }}"
  - "{{ grant_select_to_db_schema(database_schemas, var('grant_select_roles'), var('branch'), var('schema_exclusions'),var('db_exclusions')) }}" 
  #- "{{share_with_control_table(database_schemas) }}"
  #- "{{ grant_permission_to_schema(schemas, var('project_role'), var('branch')) }}"
  #- "{{ grant_select_to_schema(schemas, var('reporting_role'), var('branch')) }}"
  #- "{{ share_with_subsidiaries(var('share_with')) }}"  

vars:

  data_stages: [] # schemas to be cloned from prod and cleaned-up on test
  src_clone_db: ''
  branch: ''
  inc_offset: '-3'
  no_schema_update_branches: ['master','main']
  schema_exclusions: ['_PROD', '_FULL_LOAD', '_INCREMENTALS', '_DEV', '_STG','CES_JIRA']
  db_exclusions: ['DUMMY']
  grant_permission_roles: ['SF_DEV_CES']
  grant_select_roles: ['DEV_CES_SEC']
  share_dbt_project_name: 'RAW'

  #share_with: ['CES_MSCM:both','CES_MSCM_DAILY:both','COEX_AGILOFT:coex','COEX_CONSULTATION_MANAGER:coex','COEX_READINOW:coex','COEX_ESTRAPI:coex','COEX_COLLECT:coex','COEX_ASANA:coex','COEX_GOOGLE:coex','COEX_REFUND_DEC:coex','COEX_HSE_RESPONSES:coex','COEX_ALLOTRAC:coex','COEX_AD:coex'] 
